<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Compilateur TeX Live Natif (PDF Vectoriel)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f4f9; }
    .layout { display: flex; gap: 20px; height: 80vh; }
    .editor-container { width: 50%; display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 100%; font-family: monospace; font-size: 13px; padding: 10px; box-sizing: border-box; }
    iframe { width: 50%; height: 100%; border: 1px solid #ccc; background: #fff; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    button, label.btn { padding: 10px 15px; color: white; border: none; font-size: 14px; cursor: pointer; border-radius: 4px; display: inline-block; }
    #btnCompile { background: #28a745; }
    #btnImg { background: #6f42c1; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    input[type="file"] { display: none; }
    #status { font-weight: bold; color: #333; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>Compilateur TeX Live (Génération PDF Vectoriel)</h2>
  
  <div class="layout">
    <div class="editor-container">
      <div class="btn-group">
        <button id="btnCompile" onclick="compileTeX()">Compiler le PDF (TeX Live)</button>
        <label for="imgUpload" class="btn" id="btnImg">📷 Charger une image web</label>
        <input type="file" id="imgUpload" accept="image/png, image/jpeg" onchange="insertImageURL(event)">
      </div>
      <div id="status">Prêt pour la compilation.</div>
      
      <textarea id="latexCode">\documentclass{article}
\usepackage{graphicx}
\usepackage{amsmath}

\begin{document}

\title{Document PDF Natif via TeX Live}
\author{Auteur}
\date{\today}
\maketitle

Ceci est un document compil\'e avec un vrai moteur \textbf{pdflatex}.

\section{Formules Math\'ematiques}
La formule suivante est parfaitement vectorielle :
\[ \int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2} \]

\section{Inclusion d'images}
\begin{center}
  \includegraphics[width=0.4\textwidth]{https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/LaTeX_logo.svg/320px-LaTeX_logo.svg.png}
\end{center}

\end{document}</textarea>
    </div>

    <!-- Le vrai PDF vectoriel s'affiche ici -->
    <iframe id="pdfPreview"></iframe>
  </div>

  <script>
    async function compileTeX() {
      const btn = document.getElementById('btnCompile');
      const status = document.getElementById('status');
      const code = document.getElementById('latexCode').value;
      const iframe = document.getElementById('pdfPreview');

      btn.disabled = true;
      status.innerText = "Compilation TeX Live en cours sur le serveur...";
      status.style.color = "#007bff";

      try {
        // Envoi du code LaTeX brut au serveur pdflatex
        const response = await fetch('https://latexonline.cc/compile?text=' + encodeURIComponent(code));

        if (response.ok) {
          const blob = await response.blob();
          const pdfUrl = URL.createObjectURL(blob);
          
          iframe.src = pdfUrl;
          status.innerText = "Compilation réussie !";
          status.style.color = "green";
        } else {
          const errorText = await response.text();
          status.innerText = "Erreur de compilation LaTeX. Vérifiez votre syntaxe.";
          status.style.color = "red";
          console.error("Log d'erreur LaTeX :", errorText);
        }
      } catch (err) {
        console.error(err);
        status.innerText = "Erreur réseau lors de l'accès au serveur TeX.";
        status.style.color = "red";
      } finally {
        btn.disabled = false;
      }
    }

    // Demande l'URL d'une image en ligne pour l'intégrer
    function insertImageURL() {
      const url = prompt("Entrez l'URL publique de votre image (ex: https://.../image.png) :");
      if (!url) return;

      const textarea = document.getElementById('latexCode');
      const snippet = `\n\\begin{center}\n  \\includegraphics[width=0.5\\textwidth]{${url}}\n\\end{center}\n`;
      textarea.value += snippet;
    }
  </script>

</body>
</html>
