<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Compilateur TeX Live WASM (GitHub Pages)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f4f9; }
    .layout { display: flex; gap: 20px; height: 80vh; }
    .editor-container { width: 50%; display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 100%; font-family: monospace; font-size: 13px; padding: 10px; }
    iframe { width: 50%; height: 100%; border: 1px solid #ccc; background: #fff; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    button, label.btn { padding: 10px 15px; color: white; border: none; font-size: 14px; cursor: pointer; border-radius: 4px; display: inline-block; }
    #btnCompile { background: #28a745; }
    #btnImg { background: #6f42c1; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    input[type="file"] { display: none; }
    #status { font-weight: bold; color: #333; margin-top: 5px; }
  </style>

  <!-- Moteur WebAssembly TeX via JsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiftlatex@1.1.0/swiftlatexpdftex.js"></script>
</head>
<body>

  <h2>Compilateur TeX Live WASM (Compatible GitHub Pages)</h2>
  
  <div class="layout">
    <div class="editor-container">
      <div class="btn-group">
        <button id="btnCompile" onclick="compileTeXLive()" disabled>Compiler le vrai PDF</button>
        <label for="imgUpload" class="btn" id="btnImg">📷 Charger une image locale</label>
        <input type="file" id="imgUpload" accept="image/png, image/jpeg" onchange="uploadImageToTeX(event)">
      </div>
      <div id="status">Initialisation du moteur WASM...</div>
      
      <textarea id="latexCode">\documentclass{article}
\usepackage{graphicx}
\usepackage{amsmath}

\begin{document}

\title{Document PDF Natif via TeX Live WASM}
\author{Auteur}
\date{\today}
\maketitle

Ceci est compil\'e par le moteur \textbf{pdfTeX} fonctionnant directement dans le navigateur via WebAssembly.

\section{Formules Math\'ematiques}
Formule vectorielle pure :
\[ \int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2} \]

\section{Inclusion d'images}
Si vous ajoutez une image via le bouton ci-dessus, elle sera disponible sous le nom \texttt{image.png}.

\end{document}</textarea>
    </div>

    <!-- Le PDF vectoriel est affiché ici -->
    <iframe id="pdfPreview"></iframe>
  </div>

  <script>
    let pdfEngine = null;
    let loadedImages = {};

    async function initEngine() {
      const status = document.getElementById('status');
      const btn = document.getElementById('btnCompile');
      btn.disabled = true;

      try {
        pdfEngine = new PdfTeXEngine();

        // Utilisation du CDN JsDelivr pour charger les dépendances WASM
        pdfEngine.setBaseURL("https://cdn.jsdelivr.net/npm/swiftlatex@1.1.0/");
        
        status.innerText = "Téléchargement du moteur WASM (~8 Mo)...";
        await pdfEngine.loadEngine();
        
        status.innerText = "Moteur TeX Live prêt !";
        status.style.color = "green";
        btn.disabled = false;
      } catch (err) {
        console.error("Erreur de chargement WASM :", err);
        status.innerText = "Erreur de chargement du moteur WASM. Vérifiez la console (F12).";
        status.style.color = "red";
      }
    }

    async function compileTeXLive() {
      if (!pdfEngine) return;

      const btn = document.getElementById('btnCompile');
      const status = document.getElementById('status');
      const code = document.getElementById('latexCode').value;

      btn.disabled = true;
      status.innerText = "Compilation pdfTeX en cours...";

      try {
        // Enregistrement des images en mémoire
        for (const [filename, dataBuffer] of Object.entries(loadedImages)) {
          pdfEngine.writeMemFSFile(filename, dataBuffer);
        }

        pdfEngine.writeMemFSFile("main.tex", code);
        pdfEngine.setEngineMainFile("main.tex");

        const statusCode = await pdfEngine.processPDF();

        if (statusCode === 0) {
          const pdfData = pdfEngine.readMemFSFile("main.pdf");
          const blob = new Blob([pdfData], { type: 'application/pdf' });
          const pdfUrl = URL.createObjectURL(blob);
          
          document.getElementById('pdfPreview').src = pdfUrl;
          status.innerText = "Compilation réussie !";
          status.style.color = "green";
        } else {
          status.innerText = "Erreur de syntaxe LaTeX dans le document.";
          status.style.color = "red";
          console.log(pdfEngine.getLatexLog());
        }

      } catch (err) {
        console.error(err);
        status.innerText = "Erreur lors de la compilation.";
        status.style.color = "red";
      } finally {
        btn.disabled = false;
      }
    }

    function uploadImageToTeX(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        loadedImages["image.png"] = new Uint8Array(e.target.result);
        
        const textarea = document.getElementById('latexCode');
        if (!textarea.value.includes('image.png')) {
          textarea.value += `\n\\begin{center}\n  \\includegraphics[width=0.5\\textwidth]{image.png}\n\\end{center}\n`;
        }
        alert("Image 'image.png' chargée dans TeX Live. Cliquez sur Compiler !");
      };
      reader.readAsArrayBuffer(file);
    }

    window.onload = initEngine;
  </script>

</body>
</html>
